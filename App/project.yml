name: oDiskApps
options:
  bundleIdPrefix: com.orgista
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  oDisk:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: 2VQ74PD5YG
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  oDisk:
    type: application
    platform: macOS
    sources:
      - path: oDisk
        excludes:
          - AppIcon.icon
          - AppIcon.icon/**
      - path: oDisk/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: oDisk
        product: ODiskUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orgista.odisk
        PRODUCT_NAME: oDisk
        INFOPLIST_FILE: oDisk/Info.plist
        CODE_SIGN_ENTITLEMENTS: oDisk/oDisk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "3rd Party Mac Developer Application"
          PROVISIONING_PROFILE_SPECIFIER: "oDisk Mac App Store 2026-10-05"
  oDiskUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: oDiskUITests
    dependencies:
      - target: oDisk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orgista.odisk.uitests
        TEST_TARGET_NAME: oDisk
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  oDisk:
    build:
      targets:
        oDisk: all
        oDiskUITests: [test]
    test:
      targets:
        - oDiskUITests
